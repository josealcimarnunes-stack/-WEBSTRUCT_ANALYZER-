<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login - WebStruct.Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e17;
            background: linear-gradient(135deg, #0a0e17 0%, #1a1a2e 50%, #16213e 100%);
        }
        .login-container {
            background: #161b22;
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 420px;
            width: 90%;
            border: 1px solid #30363d;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-icon { font-size: 48px; display: block; margin-bottom: 10px; }
        .login-header h1 {
            color: #e6edf3;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #0db8e2, #f00eca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-header p { color: #8b949e; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #e6edf3;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(46, 160, 67, 0.3); }
        .error-msg {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            border-left: 3px solid #f85149;
        }
        .register-link { text-align: center; margin-top: 18px; color: #8b949e; font-size: 14px; }
        .register-link a { color: #58a6ff; text-decoration: none; font-weight: 600; }
        .register-link a:hover { text-decoration: underline; }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #484f58;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #30363d;
        }
        .divider::before { margin-right: 14px; }
        .divider::after { margin-left: 14px; }
        @media (max-width: 480px) {
            .login-container { padding: 30px 24px; }
            .login-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="login-icon">🌍</span>
            <h1>WebStruct.Analyzer</h1>
            <p>Entre para mapear qualquer site</p>
        </div>

        {% if erro %}
        <div class="error-msg">⚠️ {{ erro }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>🔑 Senha</label>
                <input type="password" name="senha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">🚀 Entrar</button>
        </form>

        <div class="divider">ou</div>
        <div class="register-link">
            Não tem conta? <a href="/register">Criar conta agora</a>
        </div>
        <div style="margin-top: 16px; text-align: center; color: #484f58; font-size: 12px;">
            🔒 Todos os dados são criptografados
        </div>
    </div>
</body>
</html>
