<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - WebStruct Analyzer Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center vh-100">
    <div class="container text-center" style="max-width: 400px;">
        <h3 class="mb-4">🚀 WebStruct Pro</h3>
        <form method="POST" action="/login" class="card bg-secondary p-4">
            <input type="text" name="username" class="form-control mb-3" placeholder="Usuário" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Senha" required>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
